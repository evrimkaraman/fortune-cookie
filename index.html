            padding: 15px;

        .container {

            font-weight: 600;

            width: 100%;
            transition: transform 0.1s ease, box-shadow 0.1s ease;

            letter-spacing: 0.5px;
        }
        .btn:active {
            transform: scale(0.97);
            box-shadow: 0 2px 10px rgba(123, 44, 191, 0.3);
        }
        .btn-secondary {
            background: #f1f2f6;
            color: #57606f;
            box-shadow: none;
            margin-top: 12px;
            border: 1px solid #dfe4ea;
        }
        .footer-note {
            margin-top: 16px;
            font-size: 0.75rem;
            color: #718093;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .hidden {
            display: none !important;
        }

            padding: 22px;
            border-radius: 20px;
            margin-bottom: 20px;
            min-height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .fortune-text {
            font-size: 1rem;
            color: #2f3640;
            font-weight: 600;
            line-height: 1.5;
            transition: all 0.3s ease;
        }
        .sparkle {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 1.2rem;
            animation: bounce 2s infinite;
